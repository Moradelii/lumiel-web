<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lumielGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="35%" stop-color="#DCC9A7" />
      <stop offset="70%" stop-color="#C9A96B" />
      <stop offset="100%" stop-color="#997738" />
    </linearGradient>
    <linearGradient id="lumielNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B66" />
      <stop offset="100%" stop-color="#0F2747" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2747" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Monogram Intertwined ML Symbol -->
  <g transform="translate(45, 20)">
    <!-- Shield / Seal subtle contour -->
    <path d="M 40,5 C 65,5 75,18 75,35 C 75,70 40,95 40,95 C 40,95 5,70 5,35 C 5,18 15,5 40,5 Z" 
          fill="none" stroke="url(#lumielGold)" stroke-width="1.5" opacity="0.4" />

    <!-- Letter M Base -->
    <path d="M 20,80 L 20,24 L 23,24 L 40,58 L 57,24 L 60,24 L 60,80 L 52,80 L 52,38 L 42,60 L 38,60 L 28,38 L 28,80 Z" 
          fill="url(#lumielNavy)" stroke="url(#lumielGold)" stroke-width="2" filter="url(#softGlow)" />
    
    <!-- Letter L Intertwined Luxury Flourish -->
    <path d="M 36,44 C 44,32 58,26 66,34 C 74,42 68,58 56,66 L 76,66 C 80,66 84,69 84,73 C 84,77 80,78 74,78 L 42,78 C 38,78 35,75 35,71 C 35,66 38,60 46,54 Z" 
          fill="url(#lumielGold)" opacity="0.95" />
    <circle cx="68" cy="32" r="3" fill="url(#lumielGold)" />
  </g>

  <!-- Typography Brand Texts -->
  <!-- MULTISERVICIOS -->
  <text x="160" y="58" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#0F2747">MULTISERVICIOS</text>

  <!-- LUMIEL -->
  <text x="160" y="112" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="7" 
        fill="#0F2747">LUMIEL</text>

  <!-- Subtitle: PROFESSIONAL DOCUMENT & NOTARY SERVICES CENTER -->
  <text x="162" y="138" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="2.5" 
        fill="#887D6B">PROFESSIONAL DOCUMENT &amp; NOTARY SERVICES CENTER</text>
  
  <!-- Subtle gold accent line -->
  <line x1="162" y1="148" x2="445" y2="148" stroke="url(#lumielGold)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
